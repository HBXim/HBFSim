# 128 GiB HBM + 512 GiB HBF physical profile, HBF/HBM = 4x.

hbm-capacity-bytes=137438953472
hbf-capacity-ratio=4
base-die-link-read-bw=1024
base-die-link-write-bw=1024
base-die-link-latency-ns=20

# Exploratory 1024-bit server HBM profile: 16 x 64-bit channels at 8 Gb/s
# gives 1024 GB/s/stack. Capacity, 4x4 banks/PC, row size, and core timings
# are simulator assumptions rather than one shipping-product declaration.
hbm-stacks=4
hbm-channels=16
hbm-pseudo-channels=2
hbm-bank-groups-per-pseudo-channel=4
hbm-banks-per-group=4
hbm-channel-row-size-bytes=2048
hbm-channel-width-bits=64
hbm-burst-length=8
hbm-pin-rate-gbps=8
hbm-data-rate-per-command-clock=4
hbm-tccd-s-cycles=2
hbm-tccd-l-cycles=4
hbm-refresh=true
hbm-same-bank-refresh=true
hbm-trefi-ns=3900
hbm-trfc-ns=350
hbm-trfcsb-ns=160
hbm-trrefd-ns=10
# Absolute core/turnaround minima are exploratory and round up to CK edges.
hbm-address-mapping-ns=0
hbm-trcdrd-ns=14
hbm-trcdwr-ns=14
hbm-tcl-ns=14
hbm-tcwl-ns=10
hbm-trp-ns=14
hbm-tras-ns=32
hbm-trc-ns=46
hbm-twr-ns=15
hbm-trtp-ns=7.5
hbm-trrd-s-ns=4
hbm-trrd-l-ns=6
hbm-tfaw-ns=20
hbm-twtr-s-ns=4
hbm-twtr-l-ns=8
hbm-trtw-ns=8

# FMS 2026 confirms UCIe as the processor connection. This is a technology
# label; public material does not disclose version, lanes, or protocol timing.
hbf-processor-interconnect=ucie
hbf-stacks=4
hbf-channels=8
hbf-dies-per-channel=1
hbf-planes-per-die=4
hbf-pages-per-block=256
hbf-page-size=4096
hbf-oob-bytes=224
hbf-media-lanes-per-plane=16
hbf-subarrays-per-plane=32
hbf-page-buffer-banks-per-plane=16
hbf-read-ns=4000
hbf-program-ns=75000
hbf-program-verify-ns=5000
hbf-erase-ns=2000000
hbf-ecc-decode-latency-ns=500
hbf-ecc-encode-latency-ns=500
# 1024 GB/s HBIO is decoded payload. ECC/channel carry the 4320 B page+OOB
# codeword; the shared TSV also carries one 64 B command per page.
hbf-ecc-decode-raw-bw=135
hbf-ecc-encode-raw-bw=135
hbf-channel-bw=135
hbf-hbio-bw=1024
hbf-tsv-bw=1096
hbf-media-lane-bw=2048
hbf-page-buffer-bw=2048
# Controller DRAM defaults to the full-resident L2P plus configured write buffer. Lookups
# use a pipelined 1 ns issue slot with a 100 ns response.

hbf-gc-low-watermark-pages=4096
hbf-gc-hard-watermark-pages=0
hbf-gc-reserved-free-blocks-per-plane=2
hbf-gc-wear-leveling-weight=0.05

hbf-write-coalescing=true
hbf-write-buffer-completion-requires-flush=false
# 1024 pages = 4 MiB: an enterprise-controller-class logic-die SRAM budget.
# 8192 pages (32 MiB) would exceed any plausible base-die SRAM.
hbf-write-buffer-pages=1024
hbf-write-buffer-flush-threshold-pages=512
