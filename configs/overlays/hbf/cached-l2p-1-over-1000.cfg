# Capacity-derived HBF controller DRAM. Each stack receives the largest
# whole-page budget no larger than 1/1000 of that stack's raw HBF capacity.
# Cached mapping charges its persistent mapping-page directory and configured
# page-granular data write buffer first, then uses the remaining bytes as an
# equal, page-granular, per-stack translation cache.
hbf-mapping-mode=cached
hbf-ctrl-dram-capacity-denominator=1000
