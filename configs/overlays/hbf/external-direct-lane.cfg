# Direct per-stack lane between each HBF base die and the external backing
# device, bypassing HBM staging. The lane exists only when this overlay (or
# an equivalent explicit declaration) is applied; there is no default
# envelope. It carries only the DIRECT_HBF_TO_EXTERNAL / DIRECT_EXTERNAL_TO_HBF
# transport stages of an explicitly chained migration: the HBF and external
# device work stay separate transactions, and the external device still
# charges its own host-link, controller, and media costs. Bandwidth and
# latency are exploratory envelopes pending calibration (no public source
# describes such a package-exit lane).
hbf-external-direct-link-enable=true
hbf-external-direct-link-read-bw=32
hbf-external-direct-link-write-bw=32
hbf-external-direct-link-latency-ns=100
