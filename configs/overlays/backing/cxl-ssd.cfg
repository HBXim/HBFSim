# Exploratory no-HBF backing profile: CXL-attached flash (CXL-SSD) behind a
# full-duplex host link — the device class prototyped by Cylon (FAST '26):
# a CXL.mem load/store front end over an FTL-managed NAND backend. The
# transport fields reuse the cxl-memory link envelope (same host attachment);
# controller timing keeps the NVMe-SSD FTL-class envelope; media follows the
# Cylon artifact's FEMU defaults (4 KiB NAND page, 8 channels x 8 LUNs,
# 40 us page read / 200 us page program; aggregate media bandwidth =
# 64 LUNs x 4 KiB / latency). Uncached miss path: the device-side DRAM
# cache and GC that Cylon also models are not folded in — apply a measured
# calibration overlay for hit-rate effects. Apply after a complete scenario
# config.
external-backing-kind=cxl-ssd
external-backing-capacity-bytes=2199023255552
external-backing-page-size=4096
external-backing-request-segment-bytes=4096
external-backing-media-channels=8
external-backing-media-read-queues=1
external-backing-media-write-queues=1
external-backing-max-outstanding-requests=512
external-backing-controller-issue-ns=20
external-backing-controller-processing-ns=500
external-backing-media-read-latency-ns=40000
external-backing-media-write-latency-ns=200000
external-backing-media-read-bw=6.5536
external-backing-media-write-bw=1.31072
external-backing-m2s-bw=36
external-backing-s2m-bw=36
external-backing-one-way-propagation-ns=75
external-backing-command-bytes=64
external-backing-completion-bytes=16
