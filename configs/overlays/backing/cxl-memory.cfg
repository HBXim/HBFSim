# Exploratory no-HBF backing profile: CXL-attached memory behind a full-duplex
# host link. Apply after a complete scenario config.
external-backing-kind=cxl-memory
external-backing-capacity-bytes=274877906944
external-backing-page-size=4096
external-backing-request-segment-bytes=4096
external-backing-media-channels=8
external-backing-media-read-queues=1
external-backing-media-write-queues=1
external-backing-max-outstanding-requests=512
external-backing-controller-issue-ns=2
external-backing-controller-processing-ns=20
external-backing-media-read-latency-ns=90
external-backing-media-write-latency-ns=90
external-backing-media-read-bw=204.8
external-backing-media-write-bw=204.8
external-backing-m2s-bw=36
external-backing-s2m-bw=36
external-backing-one-way-propagation-ns=75
external-backing-command-bytes=64
external-backing-completion-bytes=16
