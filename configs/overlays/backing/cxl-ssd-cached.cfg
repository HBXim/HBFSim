# Cylon-reference device-cache overlay for the CXL-SSD backing profile.
# Apply AFTER overlays/backing/cxl-ssd.cfg. Enables the device-side DRAM
# cache the Cylon (FAST '26) artifact runs in front of its NAND backend.
# Capacity follows the artifact's documented bufsz = flash/20 sizing rule
# (2 TiB / 20, rounded down to a whole 4 KiB segment); replacement follows
# the artifact's default FIFO (lifo, s3fifo, and clock are the other
# registered policies); prefetch is off, matching the artifact default
# prf_dg=0. Hit timing reuses the cxl-memory DRAM media envelope for the
# buffer port. Full associativity is a declared modeling simplification of
# the artifact's set-associative buffer. All values remain exploratory until
# a measured Cylon-rig calibration overlay replaces them.
external-backing-cache-enabled=true
external-backing-cache-capacity-bytes=109951160320
external-backing-cache-ways=0
external-backing-cache-policy=fifo
external-backing-cache-prefetch-degree=0
external-backing-cache-prefetch-stride=1
external-backing-cache-hit-latency-ns=90
external-backing-cache-hit-bw=204.8
