# Exploratory no-HBF backing profile: NVMe SSD behind a full-duplex host
# link. Apply after a complete scenario config.
external-backing-kind=nvme-ssd
external-backing-capacity-bytes=4398046511104
external-backing-page-size=4096
external-backing-request-segment-bytes=4096
external-backing-media-channels=4
external-backing-media-read-queues=1
external-backing-media-write-queues=1
external-backing-max-outstanding-requests=512
external-backing-controller-issue-ns=20
external-backing-controller-processing-ns=500
external-backing-media-read-latency-ns=80000
external-backing-media-write-latency-ns=100000
external-backing-media-read-bw=14
external-backing-media-write-bw=7
external-backing-m2s-bw=16
external-backing-s2m-bw=16
external-backing-one-way-propagation-ns=250
external-backing-command-bytes=64
external-backing-completion-bytes=16
