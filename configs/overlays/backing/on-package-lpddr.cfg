# Exploratory no-HBF backing profile: on-package LPDDR behind a dedicated
# full-duplex die-to-die path. Apply after a complete scenario config.
# The 2 TiB, 2 TB/s, and 100 ns points follow HotInfra'26 Table 1. Internal
# channels, controller timing, write bandwidth, and protocol records remain
# explicit sensitivity assumptions, not a calibrated LPDDR product.
external-backing-kind=on-package-lpddr
external-backing-capacity-bytes=2199023255552
external-backing-page-size=4096
external-backing-request-segment-bytes=4096
external-backing-media-channels=16
external-backing-media-read-queues=1
external-backing-media-write-queues=1
external-backing-max-outstanding-requests=512
external-backing-controller-issue-ns=2
external-backing-controller-processing-ns=20
external-backing-media-read-latency-ns=100
external-backing-media-write-latency-ns=100
external-backing-media-read-bw=2000
external-backing-media-write-bw=2000
external-backing-m2s-bw=2000
external-backing-s2m-bw=2000
external-backing-one-way-propagation-ns=0
external-backing-command-bytes=64
external-backing-completion-bytes=16
